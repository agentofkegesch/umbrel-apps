version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kegesch-wyoming-openai_wyoming_openai_1
      APP_PORT: 10300
      PROXY_AUTH_ADD: "false"
    container_name: kegesch-wyoming-openai_app_proxy_1

  wyoming_openai:
    image: ghcr.io/roryeckel/wyoming_openai:0.4.1
    container_name: kegesch-wyoming-openai_wyoming_openai_1
    init: true
    ports:
      - "10300:10300" # app-proxy uses this (HTTP UI tile)
      - "10301:10300" # direct raw TCP for Home Assistant Wyoming
    env_file:
      - ${APP_DATA_DIR}/settings.env
    restart: on-failure
