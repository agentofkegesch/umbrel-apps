version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kegesch-openbb_api_1
      APP_PORT: 6900
      PROXY_AUTH_ADD: "false"
    container_name: kegesch-openbb_app_proxy_1

  api:
    image: ghcr.io/kegesch/umbrel-apps/kegesch-openbb:1.0.2
    container_name: kegesch-openbb_api_1
    restart: on-failure
    stop_grace_period: 30s
    environment:
      - OPENBB_API_HOST=0.0.0.0
      - OPENBB_API_PORT=6900
      - HOME=/home/openbb
    volumes:
      - ${APP_DATA_DIR}/data:/home/openbb/.openbb_platform
    command: ["openbb-api", "--no-build"]
